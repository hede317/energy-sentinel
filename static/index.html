<!DOCTYPE html>
<html lang="zh" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnergySentinel · 车间配电与能源监控</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo">⚡</span>
    <div>
      <div class="title" data-i18n="app.title">车间配电与能源监控哨兵</div>
      <div class="subtitle" data-i18n="app.subtitle">EnergySentinel · Modbus 采集 → PostgreSQL → 看板 · 告警 · 工单</div>
    </div>
  </div>
  <div class="header-right">
    <span id="touBadge" class="badge"></span>
    <button id="bellBtn" class="bell" title="alarms">🔔<span id="bellCount" class="bell-count" hidden>0</span></button>
    <select id="langSel">
      <option value="zh">中文</option><option value="en">English</option>
      <option value="fr">Français</option><option value="pt">Português</option>
      <option value="es">Español</option><option value="ur">اردو</option>
      <option value="bn">বাংলা</option>
    </select>
  </div>
</header>

<nav id="tabs">
  <button data-tab="overview" class="active" data-i18n="nav.overview">总览</button>
  <button data-tab="water" data-i18n="nav.water">供水实验台</button>
  <button data-tab="trend" data-i18n="nav.trend">趋势</button>
  <button data-tab="energy" data-i18n="nav.energy">能耗报表</button>
  <button data-tab="alarms" data-i18n="nav.alarms">告警</button>
  <button data-tab="workorders" data-i18n="nav.workorders">工单</button>
  <button data-tab="devices" data-i18n="nav.devices">设备与规则</button>
  <button data-tab="api" data-i18n="nav.api">对接</button>
</nav>

<main>
<!-- ===== 总览：一次接线图 + 实时卡 ===== -->
<section id="tab-overview" class="tab active">
  <div class="card">
    <svg id="sld" viewBox="0 0 920 430" preserveAspectRatio="xMidYMid meet">
      <!-- 电源进线 -->
      <g class="grid-src">
        <circle cx="70" cy="70" r="14" fill="none" stroke="#e2e8f0" stroke-width="2"/>
        <path d="M56 78 L84 62 M56 62 L84 78" stroke="#e2e8f0" stroke-width="2"/>
        <text x="55" y="106" class="svg-label" data-i18n="ov.grid">电网进线 0.4kV</text>
      </g>
      <line x1="84" y1="70" x2="150" y2="70" class="wire"/>
      <!-- 进线总表 -->
      <g id="g-main">
        <rect x="150" y="42" width="150" height="56" rx="6" class="meter-box"/>
        <circle id="dot-meter-main" cx="162" cy="54" r="4" class="dot"/>
        <text x="172" y="60" class="svg-name" id="nm-meter-main">进线总表</text>
        <text x="172" y="86" class="svg-val"><tspan id="v-meter-main-p">--</tspan> kW</text>
        <text x="310" y="52" class="svg-sub">U: <tspan id="v-meter-main-u">--</tspan> V</text>
        <text x="310" y="70" class="svg-sub">I: <tspan id="v-meter-main-i">--</tspan> A</text>
        <text x="310" y="88" class="svg-sub">PF: <tspan id="v-meter-main-pf">--</tspan></text>
      </g>
      <line x1="225" y1="98" x2="225" y2="160" class="wire"/>
      <!-- 母排 -->
      <line x1="60" y1="160" x2="880" y2="160" class="busbar"/>
      <text x="62" y="150" class="svg-label" data-i18n="ov.bus">0.4kV 母排</text>
      <!-- 分回路由 JS 生成 #g-feeders -->
      <g id="g-feeders"></g>
    </svg>
  </div>
  <div class="card demo-bar">
    <span class="demo-title" data-i18n="dev.sim.title">演示触发器（仿真注入）：</span>
    <button class="btn warn" id="btnOverIm" data-i18n="dev.sim.overload">模拟注塑机过载</button>
    <button class="btn warn" id="btnOverAc" data-i18n="dev.sim.overload_ac">模拟空压机过载</button>
    <button class="btn warn" id="btnComm" data-i18n="dev.sim.comm_fault">模拟总表通信故障</button>
    <button class="btn danger" id="btnClear" data-i18n="dev.sim.clear">清除全部</button>
  </div>
  <div id="devCards" class="cards"></div>
</section>

<!-- ===== 供水实验台 ===== -->
<section id="tab-water" class="tab">
  <div class="card">
    <div class="card-title" data-i18n="ws.title">恒压供水闭环（PLC 教学场景）</div>
    <svg id="wsSvg" viewBox="0 0 920 310" preserveAspectRatio="xMidYMid meet">
      <!-- 水箱 -->
      <rect x="40" y="60" width="130" height="170" rx="6" class="meter-box"/>
      <rect id="wsTankLevel" x="48" y="140" width="114" height="82" rx="3" fill="#1d4ed855"/>
      <text x="105" y="52" text-anchor="middle" class="svg-label" data-i18n="ws.tank">水箱</text>
      <!-- 吸水管 -->
      <line x1="170" y1="205" x2="300" y2="205" class="pipe"/>
      <!-- 水泵 -->
      <circle cx="330" cy="205" r="27" class="svg-load"/>
      <path d="M320 193 L320 217 L344 205 Z" class="svg-load" id="wsImpeller"/>
      <text x="330" y="258" text-anchor="middle" class="svg-load-tx" data-i18n="ws.pump">水泵</text>
      <!-- 变频器 -->
      <rect x="380" y="170" width="96" height="44" rx="5" class="meter-box"/>
      <text x="428" y="188" text-anchor="middle" class="svg-name" data-i18n="ws.vfd">变频器</text>
      <text x="428" y="206" text-anchor="middle" class="svg-val" id="wsFreqVal">--</text>
      <!-- 出水管 -->
      <line x1="357" y1="205" x2="380" y2="205" class="pipe"/>
      <line x1="476" y1="205" x2="790" y2="205" class="pipe"/>
      <!-- 压力传感器 -->
      <circle cx="600" cy="205" r="16" class="svg-load"/>
      <text x="600" y="209" text-anchor="middle" class="svg-load-tx" style="font-size:13px">P</text>
      <text x="600" y="172" text-anchor="middle" class="svg-label" data-i18n="ws.sensor">压力传感器</text>
      <text x="600" y="140" text-anchor="middle" class="svg-val" style="font-size:24px" id="wsPressureVal">--</text>
      <text x="600" y="158" text-anchor="middle" class="svg-sub" id="wsSpVal">SP --</text>
      <!-- 出水 -->
      <line x1="790" y1="205" x2="850" y2="205" class="pipe"/>
      <path d="M844 197 L862 205 L844 213 Z" class="svg-load"/>
      <text x="850" y="185" text-anchor="middle" class="svg-sub"><tspan id="wsFlowVal">--</tspan> m³/h</text>
      <text x="850" y="232" text-anchor="middle" class="svg-load-tx" data-i18n="ws.outlet">出水</text>
      <!-- 功率 -->
      <text x="330" y="130" text-anchor="middle" class="svg-sub"><tspan id="wsPowerVal">--</tspan> kW</text>
      <circle id="wsDot" cx="330" cy="150" r="5" class="dot"/>
    </svg>
  </div>
  <div class="card demo-bar">
    <label data-i18n="ws.sp">压力设定</label>
    <input id="wsSpInput" type="number" step="0.01" min="0.2" max="0.55" value="0.42" style="width:80px">
    <span>MPa</span>
    <button class="btn" id="wsApply" data-i18n="ws.apply">应用设定</button>
    <button class="btn warn" id="wsDemand" data-i18n="ws.demand">模拟用水高峰</button>
    <button class="btn" id="wsNormal" data-i18n="ws.normal">恢复正常</button>
    <span class="muted" data-i18n="ws.hint">闭环：压力设定 → 变频器调频 → 泵功率（∝f³）→ 管网压力回读</span>
  </div>
  <div class="cards2">
    <div class="card"><div class="card-title"><span data-i18n="ws.pressure">压力</span> (MPa) · <span data-i18n="ws.flow">流量</span></div><canvas id="wsCanvasP" height="150"></canvas></div>
    <div class="card"><div class="card-title"><span data-i18n="ws.freq">频率</span> (Hz) · <span data-i18n="dev.ws-pump">泵</span> P (kW)</div><canvas id="wsCanvasF" height="150"></canvas></div>
  </div>
</section>

<!-- ===== 趋势 ===== -->
<section id="tab-trend" class="tab">
  <div class="card">
    <div class="controls">
      <label data-i18n="trend.metric">指标</label>
      <select id="trendMetric">
        <option value="p">P (kW)</option><option value="u">U (V)</option>
        <option value="i">I (A)</option><option value="pf">PF</option>
        <option value="pressure">Pressure (MPa)</option><option value="f">Freq (Hz)</option>
        <option value="flow">Flow (m³/h)</option>
      </select>
      <span id="trendDevs" class="devchecks"></span>
      <span class="spacer"></span>
      <button class="btn sm range active" data-h="1" data-i18n="trend.r1h">1小时</button>
      <button class="btn sm range" data-h="8" data-i18n="trend.r8h">8小时</button>
      <button class="btn sm range" data-h="24" data-i18n="trend.r24h">24小时</button>
    </div>
    <canvas id="trendCanvas" height="340"></canvas>
    <div id="trendLegend" class="legend"></div>
  </div>
</section>

<!-- ===== 能耗报表 ===== -->
<section id="tab-energy" class="tab">
  <div class="card">
    <div class="controls">
      <button class="btn sm view active" data-v="day" data-i18n="energy.day">日报</button>
      <button class="btn sm view" data-v="month" data-i18n="energy.month">月报</button>
      <input type="date" id="energyDate">
      <span id="energyTariff" class="muted"></span>
    </div>
    <div id="energyTable"></div>
    <canvas id="energyCanvas" height="220"></canvas>
  </div>
</section>

<!-- ===== 告警 ===== -->
<section id="tab-alarms" class="tab">
  <div class="card">
    <div class="controls">
      <button class="btn sm fstatus active" data-s="active" data-i18n="alarm.active">未确认</button>
      <button class="btn sm fstatus" data-s="acked" data-i18n="alarm.acked">已确认</button>
      <button class="btn sm fstatus" data-s="closed" data-i18n="alarm.closed">已关闭</button>
      <button class="btn sm fstatus" data-s="all" data-i18n="alarm.all">全部</button>
    </div>
    <div id="alarmTable"></div>
  </div>
</section>

<!-- ===== 工单 ===== -->
<section id="tab-workorders" class="tab">
  <div class="card">
    <div class="controls">
      <input id="woTitle" type="text" size="28" placeholder="">
      <input id="woAssignee" type="text" size="10" placeholder="">
      <button class="btn" id="woCreate" data-i18n="wo.create">新建工单</button>
    </div>
    <div id="woTable"></div>
  </div>
</section>

<!-- ===== 设备与规则 ===== -->
<section id="tab-devices" class="tab">
  <div id="devTable" class="card"></div>
  <div class="card">
    <div class="card-title" data-i18n="dev.rules">告警规则（阈值 · 持续时间 · 滞回）</div>
    <div id="ruleTable"></div>
    <div class="controls" id="ruleForm">
      <select id="ruleDev"></select>
      <select id="ruleMetric">
        <option value="p">P kW</option><option value="u">U V</option>
        <option value="i">I A</option><option value="pf">PF</option>
      </select>
      <select id="ruleOp"><option value="gt">&gt;</option><option value="lt">&lt;</option></select>
      <input id="ruleThreshold" type="number" step="0.1" value="50" size="6">
      <input id="ruleDur" type="number" value="10" size="4" title="duration s">
      <select id="ruleSev"><option value="info">info</option><option value="warning">warning</option><option value="critical">critical</option></select>
      <button class="btn" id="ruleAdd" data-i18n="dev.rules.add">添加规则</button>
    </div>
  </div>
</section>

<!-- ===== 对接 ===== -->
<section id="tab-api" class="tab">
  <div class="card">
    <div class="card-title" data-i18n="api.webhook">出站 Webhook（告警即时推送）</div>
    <div class="controls">
      <input id="whUrl" type="text" size="48" placeholder="https://...">
      <button class="btn" id="whSave" data-i18n="api.webhook_save">保存</button>
      <button class="btn" id="whTest" data-i18n="api.webhook_test">发送测试</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title" data-i18n="api.token">开放 API 令牌（X-API-Token）</div>
    <div class="controls">
      <input id="apiTokenInput" type="password" size="36" placeholder="token" style="min-width:260px">
      <button class="btn" id="tokenShow" data-i18n="api.token_show">显示</button>
      <button class="btn" id="tokenRegen" data-i18n="api.token_regen">重新生成</button>
    </div>
    <pre id="apiDoc" class="doc"></pre>
  </div>
  <div class="card">
    <div class="card-title" data-i18n="api.tariff">分时电价（峰 / 平 / 谷）</div>
    <div class="controls">
      <label>峰 <input id="tarPeak" type="number" step="0.01" size="5"></label>
      <label>平 <input id="tarFlat" type="number" step="0.01" size="5"></label>
      <label>谷 <input id="tarValley" type="number" step="0.01" size="5"></label>
      <button class="btn" id="tarSave" data-i18n="api.save">保存</button>
    </div>
  </div>
</section>
</main>

<div id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
